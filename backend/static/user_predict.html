<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사용자 예측</title>
</head>
<body>

<button id="predictBtn" onclick="doPredict()">예측하기</button>

<pre id="result"></pre>

<script>
async function checkForcePass() {
  const res = await fetch("/api/admin/status");
  const s = await res.json();
  document.getElementById("predictBtn").disabled = s.force_pass;
}

async function doPredict() {
  const res = await fetch("/api/predict", { method: "POST" });
  const data = await res.json();
  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);
}

checkForcePass();
setInterval(checkForcePass, 5000);
</script>

</body>
</html>
