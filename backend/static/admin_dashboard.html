<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>관리자 대시보드</h2>

  <h3>자동 중단 상태</h3>
  <div id="guardStatus">로딩 중...</div>

  <button onclick="forceStop()">⛔ 강제 중단</button>
  <button onclick="forceRelease()">▶ 중단 해제</button>

  <hr />

  <h3>최근 경주 목록</h3>
  <table border="1" width="100%">
    <thead>
      <tr>
        <th>race_id</th>
        <th>run_at</th>
        <th>decision</th>
        <th>confidence</th>
      </tr>
    </thead>
    <tbody id="raceTable"></tbody>
  </table>

  <hr />

  <h3>EV / HIT RATE 추이</h3>
  <canvas id="evChart" width="600" height="250"></canvas>

  <script>
    async function loadGuardStatus() {
      const res = await fetch("/api/admin/guard/status");
      const data = await res.json();

      document.getElementById("guardStatus").innerHTML = `
        <b>${data.forced ? "STOP" : "RUN"}</b><br/>
        avg_ev: ${data.avg_ev}<br/>
        hit_rate: ${data.hit_rate}<br/>
        reason: ${data.reason}
      `;
    }

    async function loadRaces() {
      const res = await fetch("/api/admin/pre-race/list");
      const rows = await res.json();
      const tbody = document.getElementById("raceTable");

      tbody.innerHTML = "";
      rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.race_id}</td>
          <td>${r.run_at}</td>
          <td>${r.decision}</td>
          <td>${r.confidence}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function forceStop() {
      await fetch("/api/admin/guard/force-stop", { method: "POST" });
      loadGuardStatus();
    }

    async function forceRelease() {
      await fetch("/api/admin/guard/release", { method: "POST" });
      loadGuardStatus();
    }

    async function loadChart() {
      const res = await fetch("/api/admin/pre-race/summary-stats");
      const data = await res.json();

      const ctx = document.getElementById("evChart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: data.labels,
          datasets: [
            {
              label: "Avg EV",
              data: data.avg_ev,
              borderColor: "red",
              fill: false,
            },
            {
              label: "Hit Rate",
              data: data.hit_rate,
              borderColor: "green",
              fill: false,
            },
          ],
        },
      });
    }

    loadGuardStatus();
    loadRaces();
    loadChart();
  </script>
</body>
</html>
