<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: monospace; background:#111; color:#eee; padding:20px }
    .box { border:1px solid #444; padding:12px; margin-bottom:12px }
    .ok { color:#00ff9c }
    .bad { color:#ff4d4d }
    button { padding:6px 12px; background:#333; color:#fff; border:1px solid #666 }
  </style>
</head>
<body>

<h2>🛠 ADMIN DASHBOARD</h2>

<div class="box">
  <h3>Scheduler</h3>
  <div id="scheduler">-</div>
</div>

<div class="box">
  <h3>Risk Guard</h3>
  <div>Paused: <span id="paused"></span></div>
  <div>Red Streak: <span id="red"></span></div>
</div>

<div class="box">
  <h3>Settings</h3>
  <pre id="settings"></pre>
</div>

<div class="box">
  <button onclick="resetRed()">RESET RED</button>
</div>

<script>
async function refresh() {
  const r = await fetch('/api/admin/status');
  const d = await r.json();

  document.getElementById('scheduler').innerHTML =
    d.scheduler.running ? '<span class="ok">RUNNING</span>' : '<span class="bad">STOPPED</span>';

  document.getElementById('paused').innerHTML =
    d.risk.paused ? '<span class="bad">YES</span>' : '<span class="ok">NO</span>';

  document.getElementById('red').innerText = d.risk.red_streak;
  document.getElementById('settings').innerText = JSON.stringify(d.settings, null, 2);
}

async function resetRed() {
  await fetch('/api/admin/reset-red', { method:'POST' });
  refresh();
}

refresh();
setInterval(refresh, 3000);
</script>

</body>
</html>
