<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Race Predictor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:#0b0f14;
      color:#e8eef6;
      margin:0;
      padding:20px;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background:#111826;
      border:1px solid #1e2a3a;
      border-radius:14px;
      padding:16px;
    }
    button {
      background:#1f6feb;
      border:0;
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }
    pre {
      background:#0b1220;
      border:1px solid #26364c;
      border-radius:10px;
      padding:12px;
      margin-top:12px;
      overflow:auto;
    }
    .muted { color:#9fb2cc; }
  </style>
</head>
<body>

<div class="card">
  <h2>경마 예측</h2>
  <p class="muted">실시간 예측 결과만 표시됩니다</p>

  <button onclick="runPredict()">예측 요청</button>

  <pre id="result">대기 중…</pre>
</div>

<script>
async function runPredict(){
  const res = await fetch("/api/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      race_id: "demo-" + Date.now(),
      mock_signal: Math.random() * 2 - 1
    })
  })

  const data = await res.json()
  document.getElementById("result").textContent =
    JSON.stringify(data, null, 2)
}
</script>

</body>
</html>
