<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>관리자 대시보드</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:#0b1020;color:#e9f0ff}
    .wrap{max-width:1100px;margin:22px auto;padding:0 14px}
    .title{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 18px}
    .title h1{margin:0;font-size:44px;letter-spacing:2px}
    .badge{padding:10px 14px;border-radius:999px;background:#151b2e;border:1px solid rgba(255,255,255,.08);font-weight:800}
    .row{display:grid;grid-template-columns:1fr;gap:14px}
    .panel{background:#0f1730;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px}
    .btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
    button{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer}
    .b-green{background:#16c26a;color:#06140b}
    .b-red{background:#ff4d4f;color:#1a0505}
    .b-blue{background:#2f79ff;color:#061027}
    .b-gray{background:#1b2442;color:#e9f0ff}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .code{background:#0b1020;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;min-height:92px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;line-height:1.55}
    .small{opacity:.8;font-size:12px}
    .in{width:260px;max-width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0b1020;color:#e9f0ff;font-weight:800}
    .logs{min-height:240px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>관리자 대시보드</h1>
      <span class="badge" id="badge-runmode">run_mode: -</span>
      <span class="badge" id="badge-forcepass">force_pass: -</span>
      <span class="badge" id="badge-redscore">red_score: -</span>
    </div>

    <div class="row">
      <div class="panel">
        <div class="btns">
          <input id="token" class="in" placeholder="x-admin-token (예: admin123)" />
          <button class="b-gray" id="btn-refresh">상태 새로고침</button>
        </div>

        <div style="height:12px"></div>

        <div class="btns">
          <button class="b-green" id="btn-fp-on">FORCE PASS ON</button>
          <button class="b-red" id="btn-fp-off">FORCE PASS OFF</button>
          <button class="b-blue" id="btn-pause-on">PAUSE ON</button>
          <button class="b-gray" id="btn-pause-off">PAUSE OFF</button>
          <button class="b-gray" id="btn-logs">로그 DB 조회</button>
        </div>

        <div style="height:12px"></div>

        <div class="grid2">
          <div>
            <div class="small">상태(JSON)</div>
            <div class="code" id="statusBox">{ }</div>
          </div>
          <div>
            <div class="small">메시지</div>
            <div class="code" id="msgBox"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="small">관리자 로그(DB)</div>
        <div class="code logs" id="logBox"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LS = "ADMIN_X_TOKEN";

  const tokenEl = $("token");
  const statusBox = $("statusBox");
  const msgBox = $("msgBox");
  const logBox = $("logBox");

  const badgeRun = $("badge-runmode");
  const badgeFP = $("badge-forcepass");
  const badgeRS = $("badge-redscore");

  tokenEl.value = localStorage.getItem(LS) || "";

  function headers() {
    const t = (tokenEl.value || "").trim();
    if (t) localStorage.setItem(LS, t);
    return { "x-admin-token": t };
  }

  function setMsg(text) {
    msgBox.textContent = text;
  }

  async function jfetch(url, opts={}) {
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), ...headers() } });
    const data = await r.json().catch(()=>({}));
    return { ok: r.ok, status: r.status, data };
  }

  function paintBadges(s) {
    badgeRun.textContent = `run_mode: ${s.run_mode ?? "-"}`;
    badgeFP.textContent = `force_pass: ${s.force_pass ?? "-"}`;
    badgeRS.textContent = `red_score: ${s.red_score ?? "-"}`;
  }

  async function refreshStatus() {
    const r = await jfetch("/api/admin/status");
    if (!r.ok) {
      statusBox.textContent = JSON.stringify(r.data, null, 2);
      setMsg("상태 조회 실패");
      return;
    }
    statusBox.textContent = JSON.stringify(r.data, null, 2);
    paintBadges(r.data);
    setMsg("상태 조회 성공");
  }

  async function forcePass(on) {
    const url = on ? "/api/admin/force-pass/on" : "/api/admin/force-pass/off";
    const r = await jfetch(url, { method:"POST" });
    statusBox.textContent = JSON.stringify(r.data, null, 2);
    setMsg(`FORCE PASS ${on ? "ON" : "OFF"} 요청 완료`);
    await refreshStatus();   // 🔑 핵심 수정
  }

  async function runMode(mode) {
    const url = mode === "paused"
      ? "/api/admin/run-mode/paused"
      : "/api/admin/run-mode/active";
    const r = await jfetch(url, { method:"POST" });
    statusBox.textContent = JSON.stringify(r.data, null, 2);
    setMsg(`RUN_MODE ${mode.toUpperCase()} 요청 완료`);
    await refreshStatus();   // 🔑 핵심 수정
  }

  async function fetchLogs() {
    const r = await jfetch("/api/admin/logs?limit=50");
    if (!r.ok) {
      logBox.textContent = JSON.stringify(r.data, null, 2);
      return;
    }
    const items = r.data.items || [];
    logBox.textContent = items.map(
      x => `${x.created_at} | ${x.event} | ${x.detail}`
    ).join("\n");
  }

  $("btn-refresh").onclick = refreshStatus;
  $("btn-fp-on").onclick = () => forcePass(true);
  $("btn-fp-off").onclick = () => forcePass(false);
  $("btn-pause-on").onclick = () => runMode("paused");
  $("btn-pause-off").onclick = () => runMode("active");
  $("btn-logs").onclick = fetchLogs;

  refreshStatus();
})();
</script>
</body>
</html>
