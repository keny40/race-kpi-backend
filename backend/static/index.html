<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 대시보드</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b1220, #0f172a);
      color: #e5e7eb;
    }
    h1 {
      padding: 24px;
      margin: 0;
    }
    .container {
      padding: 24px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .on { background: #22c55e; color: #022c22; }
    .off { background: #ef4444; color: #450a0a; }
    .refresh { background: #3b82f6; color: #0b1220; }
    pre {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 6px;
      max-height: 400px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>관리자 대시보드</h1>

  <div class="container">
    <div class="buttons">
      <button class="on" onclick="forcePassOn()">FORCE PASS ON</button>
      <button class="off" onclick="forcePassOff()">FORCE PASS OFF</button>
      <button class="refresh" onclick="refreshLogs()">로그 새로고침</button>
    </div>

    <pre id="logBox">로그를 불러오는 중...</pre>
  </div>

<script>
async function forcePassOn() {
  await fetch("/api/admin/force-pass/on", { method: "POST" });
  await refreshLogs();
}

async function forcePassOff() {
  await fetch("/api/admin/force-pass/off", { method: "POST" });
  await refreshLogs();
}

async function refreshLogs() {
  const res = await fetch("/api/admin/logs");
  const data = await res.json();
  document.getElementById("logBox").innerText =
    JSON.stringify(data, null, 2);
}

refreshLogs();
</script>
</body>
</html>
