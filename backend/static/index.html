<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>관리자 대시보드</title>
  <style>
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#0b1220; color:#fff; }
    .wrap { max-width:1100px; margin:0 auto; padding:40px 20px; }
    h1 { font-size:44px; margin:0 0 24px; }
    .row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    button { border:0; padding:14px 18px; border-radius:10px; font-weight:700; cursor:pointer; }
    .on { background:#1cc46b; }
    .off { background:#ff4b4b; }
    .log { background:#3b82f6; }
    .ghost { background:rgba(255,255,255,.08); color:#fff; }
    .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:16px; }
    pre { margin:0; white-space:pre-wrap; word-break:break-word; }
    a { color:#93c5fd; text-decoration:none; }
    .small { opacity:.8; font-size:13px; margin-top:8px; }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); margin-left:10px; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>관리자 대시보드 <span id="st" class="badge">status: -</span></h1>

    <div class="row">
      <button class="on" id="btnOn">FORCE PASS ON</button>
      <button class="off" id="btnOff">FORCE PASS OFF</button>
      <button class="log" id="btnLogs">로그 보기</button>
      <button class="ghost" id="btnRefresh">상태 새로고침</button>
    </div>

    <div class="card">
      <pre id="out">{ "ready": true }</pre>
      <div class="small">
        UI: <a href="/ui/admin_logs.html">/ui/admin_logs.html</a> ·
        API: <code>/api/admin/status</code>, <code>/api/admin/force-pass/on</code>, <code>/api/admin/force-pass/off</code>
      </div>
    </div>
  </div>

<script>
  const out = document.getElementById('out');
  const st = document.getElementById('st');

  function getToken() {
    let t = localStorage.getItem('admin_token');
    if (!t) {
      t = prompt('관리자 비밀번호를 입력하세요');
      if (t) localStorage.setItem('admin_token', t);
    }
    return t || '';
  }

  async function call(path, method='GET') {
    const token = getToken();
    const res = await fetch(path, {
      method,
      headers: {
        'x-admin-token': token
      }
    });
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch(e) { data = txt; }
    if (!res.ok) {
      out.textContent = JSON.stringify(data, null, 2);
      throw new Error('request failed');
    }
    out.textContent = JSON.stringify(data, null, 2);
    return data;
  }

  async function refreshStatus() {
    try {
      const data = await call('/api/admin/status', 'GET');
      st.textContent = 'force_pass: ' + (data.force_pass ? 'ON' : 'OFF');
    } catch(e) {
      st.textContent = 'status: ERROR';
    }
  }

  document.getElementById('btnOn').onclick = async () => { await call('/api/admin/force-pass/on', 'POST'); await refreshStatus(); };
  document.getElementById('btnOff').onclick = async () => { await call('/api/admin/force-pass/off', 'POST'); await refreshStatus(); };
  document.getElementById('btnLogs').onclick = () => { location.href = '/ui/admin_logs.html'; };
  document.getElementById('btnRefresh').onclick = refreshStatus;

  refreshStatus();
</script>
</body>
</html>
