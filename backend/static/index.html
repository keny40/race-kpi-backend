<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 대시보드</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: #e5e7eb;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .ok { background: #22c55e; color: #022c22; }
    .no { background: #ef4444; color: #450a0a; }

    .buttons {
      padding: 0 24px;
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .on { background: #22c55e; color: #022c22; }
    .off { background: #ef4444; color: #450a0a; }
    .refresh { background: #3b82f6; color: #020617; }

    pre {
      margin: 0 24px 24px;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 6px;
      max-height: 360px;
      overflow: auto;
    }
  </style>
</head>
<body>

<header>
  <h1>관리자 대시보드</h1>
  <span id="authBadge" class="badge no">미인증</span>
</header>

<div class="buttons">
  <button id="btnOn" class="on" onclick="forcePassOn()">FORCE PASS ON</button>
  <button id="btnOff" class="off" onclick="forcePassOff()">FORCE PASS OFF</button>
  <button class="refresh" onclick="refreshLogs()">로그 새로고침</button>
</div>

<pre id="logBox">대기 중...</pre>

<script>
function updateAuthUI() {
  const ok = localStorage.getItem("isAdmin") === "1";
  document.getElementById("authBadge").className = "badge " + (ok ? "ok" : "no");
  document.getElementById("authBadge").innerText = ok ? "인증됨" : "미인증";
  document.getElementById("btnOn").disabled = !ok;
  document.getElementById("btnOff").disabled = !ok;
}

async function forcePassOn() {
  await fetch("/api/admin/force-pass/on", { method: "POST" });
  refreshLogs();
}

async function forcePassOff() {
  await fetch("/api/admin/force-pass/off", { method: "POST" });
  refreshLogs();
}

async function refreshLogs() {
  const res = await fetch("/api/admin/logs");
  const data = await res.json();
  document.getElementById("logBox").innerText =
    JSON.stringify(data, null, 2);
}

updateAuthUI();
refreshLogs();
</script>

setInterval(() => {
  if (localStorage.getItem("isAdmin") === "1") {
    refreshLogs();
  }
}, 5000);


</body>
</html>
