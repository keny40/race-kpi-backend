<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>관리자 액션 로그</title>
  <style>
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto; background:#0b1220; color:#fff; }
    .wrap { max-width:1200px; margin:0 auto; padding:34px 18px; }
    h1 { font-size:34px; margin:0 0 16px; display:flex; align-items:center; gap:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    button, input { border:0; padding:10px 12px; border-radius:10px; font-weight:700; }
    button { cursor:pointer; }
    .blue { background:#3b82f6; color:#fff; }
    .ghost { background:rgba(255,255,255,.08); color:#fff; }
    input { background:rgba(255,255,255,.08); color:#fff; outline:none; }
    .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:12px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.10); font-size:14px; }
    th { color:#93c5fd; font-weight:800; }
    .small { opacity:.8; font-size:13px; margin-top:10px; }
    a { color:#93c5fd; text-decoration:none; }
    code { background:rgba(255,255,255,.08); padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🛠 관리자 액션 로그</h1>

    <div class="row">
      <button class="blue" id="btnLoad">불러오기</button>
      <button class="ghost" id="btnHome">대시보드</button>
      <button class="ghost" id="btnCSV">CSV</button>
      <button class="ghost" id="btnPDF">PDF</button>
      <input id="limit" type="number" min="1" max="1000" value="200" />
      <button class="ghost" id="btnReauth">비밀번호 재입력</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:260px;">시간</th>
            <th style="width:220px;">액션</th>
            <th>상세</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="small">
        API: <code>/api/admin/logs</code> · 파일: <code>/api/admin/logs.csv</code>, <code>/api/admin/logs.pdf</code> ·
        <a href="/ui/index.html">/ui/index.html</a>
      </div>
    </div>
  </div>

<script>
  const tbody = document.getElementById('tbody');
  const limitEl = document.getElementById('limit');

  function getToken() {
    let t = localStorage.getItem('admin_token');
    if (!t) {
      t = prompt('관리자 비밀번호를 입력하세요');
      if (t) localStorage.setItem('admin_token', t);
    }
    return t || '';
  }

  async function fetchJson(path) {
    const token = getToken();
    const res = await fetch(path, { headers: { 'x-admin-token': token } });
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch(e) { data = { error: txt }; }
    if (!res.ok) throw data;
    return data;
  }

  function render(rows) {
    tbody.innerHTML = '';
    if (!rows || rows.length === 0) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="3" style="opacity:.7;">로그가 없습니다</td>';
      tbody.appendChild(tr);
      return;
    }
    for (const r of rows) {
      const tr = document.createElement('tr');
      const ca = r.created_at || '';
      const ac = r.action || '';
      const de = r.detail || '';
      tr.innerHTML = `<td>${escapeHtml(ca)}</td><td>${escapeHtml(ac)}</td><td>${escapeHtml(de)}</td>`;
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  async function load() {
    const limit = Math.max(1, Math.min(1000, Number(limitEl.value || 200)));
    try {
      const rows = await fetchJson(`/api/admin/logs?limit=${limit}`);
      render(rows);
    } catch (e) {
      render([{ created_at: '', action: 'ERROR', detail: JSON.stringify(e) }]);
    }
  }

  document.getElementById('btnLoad').onclick = load;
  document.getElementById('btnHome').onclick = () => location.href = '/ui/index.html';
  document.getElementById('btnCSV').onclick = () => {
    const limit = Math.max(1, Math.min(5000, Number(limitEl.value || 200)));
    location.href = `/api/admin/logs.csv?limit=${limit}`;
  };
  document.getElementById('btnPDF').onclick = () => {
    const limit = Math.max(1, Math.min(3000, Number(limitEl.value || 200)));
    location.href = `/api/admin/logs.pdf?limit=${limit}`;
  };
  document.getElementById('btnReauth').onclick = () => {
    localStorage.removeItem('admin_token');
    alert('저장된 비밀번호를 삭제했습니다. 다시 로드하면 재입력됩니다.');
  };

  load();
</script>
</body>
</html>
