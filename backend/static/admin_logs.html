<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 액션 로그</title>
</head>
<body>

<h1>관리자 액션 로그</h1>

<div>
  <a href="/api/admin/logs.csv" target="_blank">CSV 다운로드</a>
  |
  <a href="/api/admin/logs.pdf" target="_blank">PDF 다운로드</a>
</div>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>시간</th>
      <th>액션</th>
      <th>상세</th>
    </tr>
  </thead>
  <tbody id="logTable"></tbody>
</table>

<script>
async function loadLogs() {
  const res = await fetch("/api/admin/logs");
  const data = await res.json();

  const tbody = document.getElementById("logTable");
  tbody.innerHTML = "";

  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.created_at || ""}</td>
      <td>${r.action || ""}</td>
      <td>${r.detail || ""}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadLogs();
setInterval(loadLogs, 5000);
</script>

</body>
</html>
